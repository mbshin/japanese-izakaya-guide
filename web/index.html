<title>카운터 카드</title>
<style>
/* ============ tokens: light is the base set ============ */
:root{
  --ground:#FAF6F0;
  --surface:#FFFFFF;
  --surface-2:#F1EAE0;
  --line:#E0D5C6;
  --ink:#1B1613;
  --ink-2:#5C5148;
  --ink-3:#8A7C6E;
  --accent:#A8630B;
  --accent-soft:#F6E3C6;
  --accent-ink:#FFFFFF;
  --golf:#4A7238;
  --golf-soft:#E2EDD9;
  --danger:#B23A2E;
  --danger-soft:#F8DED9;
  --shadow:0 1px 2px rgba(60,40,20,.10),0 8px 24px -12px rgba(60,40,20,.22);
  --overlay-scrim:rgba(28,20,14,.62);
  --yt:#C4302B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141110;
    --surface:#1E1A17;
    --surface-2:#282320;
    --line:#3A322C;
    --ink:#F3ECE3;
    --ink-2:#B9AC9F;
    --ink-3:#8B7F73;
    --accent:#E8A33D;
    --accent-soft:#3A2C15;
    --accent-ink:#1B1308;
    --golf:#8FBE72;
    --golf-soft:#22301A;
    --danger:#E9776A;
    --danger-soft:#3A1C18;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.8);
    --overlay-scrim:rgba(8,6,5,.78);
    --yt:#E85D57;
  }
}
:root[data-theme="dark"]{
  --ground:#141110;
  --surface:#1E1A17;
  --surface-2:#282320;
  --line:#3A322C;
  --ink:#F3ECE3;
  --ink-2:#B9AC9F;
  --ink-3:#8B7F73;
  --accent:#E8A33D;
  --accent-soft:#3A2C15;
  --accent-ink:#1B1308;
  --golf:#8FBE72;
  --golf-soft:#22301A;
  --danger:#E9776A;
  --danger-soft:#3A1C18;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.8);
  --overlay-scrim:rgba(8,6,5,.78);
  --yt:#E85D57;
}

/* ============ base ============ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
.jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Meiryo",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ============ header ============ */
.top{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:720px;margin:0 auto;padding:10px 14px 8px;display:flex;flex-direction:column;gap:9px}
.brandrow{display:flex;align-items:baseline;gap:9px}
.brand{font-size:17px;font-weight:800;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--accent)}
.kicker{
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin-left:auto;
}
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:0 12px;height:42px;
}
.search svg{flex:none;color:var(--ink-3)}
.search input{
  flex:1;min-width:0;border:0;background:none;color:var(--ink);
  font:inherit;font-size:15px;height:100%;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none}
.clearbtn{color:var(--ink-3);font-size:19px;line-height:1;padding:4px}
.romtog{
  flex:none;margin-left:auto;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-size:11.5px;font-weight:700;color:var(--ink-3);
}
.romtog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ============ tabs ============ */
.tabs{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:0 -14px;padding:0 14px 2px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[data-k="golf"][aria-selected="true"]{background:var(--golf);border-color:var(--golf);color:var(--ground)}
.tab[data-k="safe"][aria-selected="true"]{background:var(--danger);border-color:var(--danger);color:var(--ground)}

/* ============ layout ============ */
main{max-width:720px;margin:0 auto;padding:16px 14px 96px;display:flex;flex-direction:column;gap:26px}
.group{display:flex;flex-direction:column;gap:9px;scroll-margin-top:132px}
.ghead{display:flex;align-items:center;gap:9px;padding:0 2px}
.gtitle{font-size:13px;font-weight:800;letter-spacing:.02em}
.gnote{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right}
.rail{width:3px;height:15px;border-radius:2px;background:var(--accent);flex:none}
.group[data-k="golf"] .rail{background:var(--golf)}
.group[data-k="safe"] .rail{background:var(--danger)}

.stack{display:flex;flex-direction:column;gap:7px}

/* ============ phrase card ============ */
.card{
  width:100%;text-align:left;display:block;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease;
}
.card:active{transform:scale(.985);border-color:var(--accent)}
.ja{
  font-size:24px;font-weight:700;letter-spacing:.01em;line-height:1.35;
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
}
.furi{font-size:14px;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}
.rom{
  font-size:13px;color:var(--accent);font-weight:700;margin-top:6px;
  padding-top:6px;border-top:1px dashed var(--line);
}
body.hide-rom .rom{display:none}
.say{
  font-size:19px;font-weight:750;letter-spacing:-.015em;line-height:1.25;
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
}
.star{font-size:11px;color:var(--accent);letter-spacing:-.08em;transform:translateY(-1px)}
.mean{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.orig{font-size:13px;color:var(--ink-3);margin-top:5px;display:flex;align-items:center;gap:6px}
.mean{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.orig .tapicon{
  flex:none;font-size:9.5px;font-weight:800;letter-spacing:.1em;
  color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);
  padding:2px 5px;border-radius:4px;
}
.group[data-k="golf"] .orig .tapicon{color:var(--golf);border-color:var(--golf-soft);background:var(--golf-soft)}
.group[data-k="safe"] .orig .tapicon{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}

/* heard-not-said rows */
.card.heard{background:var(--surface-2);border-style:dashed}
.card.heard .ja{font-size:19px;font-weight:650;color:var(--ink-2)}
.card.heard .say{font-size:16px;font-weight:650;color:var(--ink-2)}
.card.heard .reply{margin-top:7px;font-size:14px;font-weight:700}
.card.heard .reply span{color:var(--accent)}

/* ============ note ============ */
.note{
  border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 9px 9px 0;padding:10px 12px;font-size:13.5px;line-height:1.5;
}
.note.warn{border-left-color:var(--danger);background:var(--danger-soft)}
.note b{font-weight:800}


/* ============ youtube ============ */
.ytrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 2px;padding:0 14px 2px}
.ytrow::-webkit-scrollbar{display:none}
.yt{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px 6px 8px;font-size:12.5px;font-weight:650;color:var(--ink-2);
  text-decoration:none;white-space:nowrap;
}
.yt:active{border-color:var(--yt)}
.yt .play{
  flex:none;width:17px;height:12px;border-radius:3px;background:var(--yt);
  display:grid;place-items:center;
}
.yt .play::after{content:"";border-left:5px solid #fff;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;margin-left:1px}
.chan{display:flex;flex-direction:column;gap:7px}
.chanrow{
  display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
}
.chanrow:active{border-color:var(--yt)}
.chanrow .play{flex:none;width:26px;height:19px;border-radius:5px;background:var(--yt);display:grid;place-items:center}
.chanrow .play::after{content:"";border-left:8px solid #fff;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent;margin-left:2px}
.chanrow>span:nth-child(2){display:flex;flex-direction:column;min-width:0}
.chanrow .cn{font-size:14.5px;font-weight:750;letter-spacing:-.01em}
.chanrow .cd{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.chanrow .cstar{margin-left:auto;flex:none;font-size:11px;color:var(--accent);letter-spacing:-.08em}

/* ============ read: kana ============ */
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
table{border-collapse:separate;border-spacing:5px;font-size:13px}
td,th{padding:0}
.kcell{
  min-width:58px;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:7px 4px;text-align:center;
}
.kcell .kg{font-size:16px;letter-spacing:.06em}
.kcell .kr{font-size:12.5px;font-weight:800;color:var(--accent);margin-top:2px}
.krow{font-size:11px;font-weight:800;color:var(--ink-3);padding-right:3px;text-align:right;white-space:nowrap}
.kcell.empty{background:none;border-color:transparent}

/* ============ read: chips ============ */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.chip{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px;
}
.chip .cj{font-size:19px;font-weight:700;letter-spacing:.02em}
.chip .cf{font-size:12px;color:var(--ink-3);margin-top:1px}
.chip .cr{font-size:11.5px;color:var(--accent);font-weight:700;margin-top:2px}
body.hide-rom .chip .cr{display:none}
.chip .cm{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.chip.hot{border-color:var(--accent)}

/* ============ read: numbers ============ */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.num{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px 9px;display:flex;align-items:baseline;gap:7px;
  font-variant-numeric:tabular-nums;
}
.num b{font-size:15px;color:var(--ink-3);min-width:36px}
.num span{font-size:14.5px;font-weight:800}

/* ============ rules ============ */
.rules{display:flex;flex-direction:column;gap:7px;counter-reset:r}
.rule{
  display:flex;gap:11px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
}
.rule::before{
  counter-increment:r;content:counter(r);
  flex:none;width:23px;height:23px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);
  font-size:12px;font-weight:800;display:grid;place-items:center;
}
.rule p{margin:0;font-size:14px;font-weight:700}
.rule small{display:block;font-weight:500;color:var(--ink-2);font-size:12.5px;margin-top:2px}

/* ============ empty ============ */
.empty-state{text-align:center;color:var(--ink-3);font-size:14px;padding:44px 0}

/* ============ show overlay ============ */
.show{
  position:fixed;inset:0;z-index:100;display:none;
  background:var(--overlay-scrim);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:18px;place-items:center;
}
.show.on{display:grid}
.showcard{
  width:100%;max-width:520px;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;
  padding:26px 22px 20px;text-align:center;box-shadow:var(--shadow);
  animation:pop .18s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.showlabel{
  font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:16px;
}
.showjp{font-size:29px;font-weight:700;line-height:1.4;letter-spacing:.01em}
.showfuri{margin-top:8px;font-size:16px;color:var(--ink-3)}
.showmean{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.showsay{margin-top:5px;font-size:16px;font-weight:800;color:var(--accent)}
.showclose{
  margin-top:20px;width:100%;height:46px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:14px;font-weight:700;color:var(--ink-2);
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:600px){
  .say{font-size:20px}
  .showjp{font-size:36px}
}
footer{
  max-width:720px;margin:0 auto;padding:0 14px 40px;
  color:var(--ink-3);font-size:12px;line-height:1.6;
}
footer a{color:var(--accent)}
</style>

<div class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="brand">카운터 <em>카드</em></div>
      <button class="romtog" id="romtog" aria-pressed="true">한글 읽기</button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input id="q" type="search" placeholder="한국어로 찾기 — 얼마, 추천, 건배…" autocomplete="off" aria-label="문장 검색">
      <button class="clearbtn" id="clear" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</div>

<main id="main"></main>

<footer>
  문장을 탭하면 일본어가 크게 표시됩니다. <b>폰을 돌려서 상대에게 보여주세요.</b><br>
  전체 자료 · <a href="https://github.com/mbshin/japanese-izakaya-guide">github.com/mbshin/japanese-izakaya-guide</a>
</footer>

<div class="show" id="show" role="dialog" aria-modal="true" aria-label="상대에게 보여주기">
  <div class="showcard">
    <div class="showlabel">상대에게 보여주세요</div>
    <div class="showjp jp" id="showjp"></div>
    <div class="showfuri jp" id="showfuri"></div>
    <div class="showmean" id="showmean"></div>
    <div class="showsay" id="showsay"></div>
    <button class="showclose" id="showclose">닫기</button>
  </div>
</div>

<script>

const TABS=[['all','전체']];
DATA.forEach(g=>{ if(g.tab && !TABS.some(t=>t[0]===g.k)) TABS.push([g.k,g.tab]); });

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=n=>n>=3?'★★★':n===2?'★★':n===1?'★':'';

function kanaTable(rows){
  let h='<div class="scroller"><table>';
  rows.forEach(r=>{
    h+='<tr><td class="krow">'+esc(r[0])+'</td>';
    for(let i=1;i<r.length;i++){
      if(!r[i]){h+='<td class="kcell empty"></td>';continue}
      const [g,k]=r[i].split('|');
      h+='<td class="kcell"><div class="kg jp">'+esc(g)+'</div><div class="kr">'+esc(k)+'</div></td>';
    }
    h+='</tr>';
  });
  return h+'</table></div>';
}

function ytRow(list){
  return '<div class="ytrow">'+list.map(y=>
    '<a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='
    +encodeURIComponent(y[1])+'"><span class="play"></span>'+esc(y[0])+'</a>').join('')+'</div>';
}
function chanList(list){
  return '<div class="chan">'+list.map(c=>
    '<a class="chanrow" target="_blank" rel="noopener" href="'+esc(c[2])+'">'
    +'<span class="play"></span><span><span class="cn">'+esc(c[0])+'</span>'
    +'<span class="cd">'+esc(c[1])+'</span></span>'
    +(c[3]?'<span class="cstar">'+stars(c[3])+'</span>':'')+'</a>').join('')+'</div>';
}
function render(filter,tab){
  const f=(filter||'').trim().toLowerCase();
  const main=document.getElementById('main');
  let out='',shown=0;

  DATA.forEach(g=>{
    if(tab!=='all' && g.k!==tab) return;
    let body='';
    if(g.yt && !f) body+=ytRow(g.yt);
    if(g.chans){
      const rows=g.chans.filter(c=>!f||(c[0]+c[1]).toLowerCase().includes(f));
      if(rows.length) body+=chanList(rows);
    }

    if(g.items){
      const rows=g.items.filter(p=>!f||(p[0]+p[1]+p[2]+(KANA[p[1]]||'')).toLowerCase().includes(f));
      if(rows.length){
        body+='<div class="stack">';
        rows.forEach(p=>{
          const kn=KANA[p[1]]||'';
          body+='<button class="card" data-jp="'+esc(p[1])+'" data-kana="'+esc(kn)+'" data-mean="'+esc(p[2])+'" data-say="'+esc(p[0])+'">'
             +'<div class="ja jp">'+esc(p[1])+(p[3]?'<span class="star">'+stars(p[3])+'</span>':'')+'</div>'
             +(kn?'<div class="furi jp">'+esc(kn)+'</div>':'')
             +'<div class="mean">'+esc(p[2])+'</div>'
             +'<div class="rom">'+esc(p[0])+'</div>'
             +'</button>';
        });
        body+='</div>';
      }
    }

    if(g.heard){
      const rows=g.heard.filter(p=>!f||(p[0]+p[1]+p[2]+p[3]).toLowerCase().includes(f));
      if(rows.length){
        body+='<div class="stack">';
        rows.forEach(p=>{
          const kn=KANA[p[1]]||'';
          body+='<div class="card heard">'
             +'<div class="ja jp">'+esc(p[1])+'</div>'
             +(kn?'<div class="furi jp">'+esc(kn)+'</div>':'')
             +'<div class="mean">'+esc(p[2])+'</div>'
             +'<div class="rom">'+esc(p[0])+' → <b>'+esc(p[3])+'</b></div>'
             +'</div>';
        });
        body+='</div>';
      }
    }

    if(g.counts && !f){
      body+='<div class="nums">'+COUNTS.map(n=>'<div class="num"><b>'+esc(n[0])+'</b><span>'+esc(n[1])+'</span></div>').join('')+'</div>';
    }
    if(g.kana && !f) body+=kanaTable(g.kana==='base'?KANA_BASE:KANA_DAKU);
    if(g.chips){
      const rows=g.chips.filter(c=>!f||(c[0]+c[1]+c[2]).toLowerCase().includes(f));
      if(rows.length) body+='<div class="chips">'+rows.map(c=>
        '<div class="chip'+(c[3]?' hot':'')+'"><div class="cj jp">'+esc(c[0])+'</div>'
        +(KANA[c[0]]?'<div class="cf jp">'+esc(KANA[c[0]])+'</div>':'')
        +'<div class="cm">'+esc(c[2])+'</div><div class="cr">'+esc(c[1])+'</div></div>').join('')+'</div>';
    }
    if(g.nums && !f){
      body+='<div class="nums">'+NUMS.map(n=>'<div class="num"><b>'+esc(n[0])+'</b><span>'+esc(n[1])+'</span></div>').join('')+'</div>';
    }
    if(g.rules && !f){
      body+='<div class="rules">'+RULES.map(r=>'<div class="rule"><div><p>'+esc(r[0])+'<small>'+esc(r[1])+'</small></p></div></div>').join('')+'</div>';
    }
    if(g.tips && !f) g.tips.forEach(t=>{ body+='<div class="note'+(t[0]==='warn'?' warn':'')+'">'+t[1]+'</div>'; });

    if(!body) return;
    shown++;
    out+='<section class="group" data-k="'+g.k+'">'
       +'<div class="ghead"><span class="rail"></span><span class="gtitle">'+esc(g.title)+'</span>'
       +(g.note?'<span class="gnote">'+esc(g.note)+'</span>':'')+'</div>'+body+'</section>';
  });

  main.innerHTML = shown ? out : '<div class="empty-state">찾는 말이 없습니다.<br>다른 한국어 단어로 검색해 보세요.</div>';
}

/* tabs */
let curTab='all';
const tabsEl=document.getElementById('tabs');
tabsEl.innerHTML=TABS.map((t,i)=>'<button class="tab" role="tab" data-k="'+t[0]+'" aria-selected="'+(i===0)+'">'+esc(t[1])+'</button>').join('');
tabsEl.addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  curTab=b.dataset.k;
  [...tabsEl.children].forEach(x=>x.setAttribute('aria-selected',String(x===b)));
  render(document.getElementById('q').value,curTab);
  window.scrollTo({top:0,behavior:'smooth'});
});

/* search */
const q=document.getElementById('q'), clearBtn=document.getElementById('clear');
q.addEventListener('input',()=>{ clearBtn.hidden=!q.value; render(q.value,curTab); });
clearBtn.addEventListener('click',()=>{ q.value=''; clearBtn.hidden=true; render('',curTab); q.focus(); });

/* show overlay */
const show=document.getElementById('show');
function openShow(el){
  document.getElementById('showjp').textContent=el.dataset.jp;
  document.getElementById('showfuri').textContent=el.dataset.kana||'';
  document.getElementById('showmean').textContent=el.dataset.mean;
  document.getElementById('showsay').textContent=el.dataset.say;
  show.classList.add('on');
}
function closeShow(){ show.classList.remove('on'); }
document.getElementById('main').addEventListener('click',e=>{
  const c=e.target.closest('.card[data-jp]'); if(c) openShow(c);
});
show.addEventListener('click',e=>{ if(e.target===show||e.target.id==='showclose') closeShow(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeShow(); });

const romtog=document.getElementById('romtog');
const romOff=localStorage.getItem('romOff')==='1';
if(romOff){document.body.classList.add('hide-rom');romtog.setAttribute('aria-pressed','false');}
romtog.addEventListener('click',()=>{
  const off=document.body.classList.toggle('hide-rom');
  romtog.setAttribute('aria-pressed',String(!off));
  localStorage.setItem('romOff',off?'1':'0');
});

render('','all');
</script>
